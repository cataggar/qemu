name: Release

# Builds qemu-img/qemu-io plus a native qemu-system-<arch> (with hardware
# acceleration) for Linux, macOS, and Windows, with `zig cc` from the
# workflow's current commit, and publishes them as a GitHub Release.
#
# This is the zig16-branch counterpart of the `ghr`-branch release.yml.
# The Linux jobs use Zig-managed target libraries and musl to produce fully
# static executables. The macOS job remains a native build using Homebrew
# target libraries. Both build a qemu-system-<arch> matching the runner's
# own host architecture (x86_64 on linux-x64, aarch64 on
# linux-arm64/macos-arm64), each with the accelerator available on that
# host: KVM on Linux, HVF on macOS. Neither is runtime-tested in CI: Linux
# runners have no /dev/kvm, and while macOS runners do run on real Apple
# hardware, their Hypervisor.framework access turns out to still be
# restricted enough that even qemu-system-aarch64's `-M virt -accel hvf`
# board init fails outright (hv_vm_config_get_max_ipa_size() returns
# HV_UNSUPPORTED) -- confirmed by actually trying it in CI. So both are
# build-verified only, same as WHPX on Windows below.
#
# Every host also builds and ships *every other* QEMU softmmu target
# (configs/targets/*-softmmu.mak) TCG-only, i.e. without an accelerator:
# KVM/HVF/WHPX only ever apply to a target matching the host's own
# architecture (the one already covered above), so none of these others
# have a hardware accelerator to enable in the first place. These are
# built in a second, separate configure/ninja invocation per host so the
# primary target's accelerated build above stays untouched, and are
# build-verified only (same caveat as the accelerated binaries above).
#
# The Windows job is replaced entirely: instead of a native windows-latest
# runner + MSYS2 (see the ghr-branch version), it does a *true
# cross-compile* from an ubuntu-latest runner using our own zig-built
# glib/pixman/libiconv/gettext/zlib/zstd/nettle/libslirp (see
# https://github.com/cataggar/qemu/issues/17 and #20) -- no MSYS2, no
# vcpkg, no native Windows runner at all. It also builds
# qemu-system-x86_64.exe with WHPX acceleration in addition to the two
# tools, since that's now cross-compilable too (issue #20); manually
# verified to boot real guest code under `-accel whpx` on real Windows
# hardware (see issue #20's writeup -- GitHub-hosted Windows runners don't
# support nested virtualization, so this can't be runtime-tested in CI).
on:
  push:
    tags:
      - 'v*-z.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v2026.07.09'
        required: true

env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            system_target: x86_64-softmmu
            system_bin: qemu-system-x86_64
            accel_opt: --enable-kvm
          - os: ubuntu-24.04-arm
            name: linux-arm64
            system_target: aarch64-softmmu
            system_bin: qemu-system-aarch64
            accel_opt: --enable-kvm
          # Native build (not cross-compiled): zig cc as the compiler, but
          # dependencies (glib2/pixman) come from Homebrew. True
          # cross-compilation to macOS from Linux isn't covered by this
          # branch's work (see issue #17); only Windows is (see the
          # separate build-windows-cross job below).
          - os: macos-latest
            name: macos-arm64
            experimental: true
            system_target: aarch64-softmmu
            system_bin: qemu-system-aarch64
            accel_opt: --enable-hvf
    outputs:
      qemu_sha: ${{ steps.resolve.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout current QEMU commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Record resolved commit
        id: resolve
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        # Package list is QEMU's own documented minimal build environment,
        # see docs/devel/build-environment.rst (qemu-minimal.yml via lcitool).
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bash bc bison bzip2 ca-certificates ccache findutils flex gcc git \
            libc6-dev locales make ninja-build pkgconf python3 python3-venv sed tar

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        # Same minimal set as Linux, via Homebrew. bison/flex explicitly
        # pulled in: macOS ships an old BSD bison incompatible with QEMU's
        # build (even just for `configure`, via the hexagon target parser).
        run: |
          brew update
          brew install bison flex glib libslirp pixman pkg-config ninja meson

      - name: Install zig cc via ghr
        uses: cataggar/ghr/actions/install@v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build qemu-img/qemu-io/${{ matrix.system_bin }} with zig cc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export QEMU_PKG_VERSION="${{ env.RELEASE_VERSION }}"
          export QEMU_ZIG_ACCEL_OPT="${{ matrix.accel_opt }}"
          scripts/build-static-linux-with-zig.sh \
            build-zig \
            "${{ matrix.system_target }}" \
            qemu-img qemu-io "${{ matrix.system_bin }}"

      - name: Build other (non-accelerated) qemu-system-* targets (Linux)
        if: runner.os == 'Linux'
        # Every softmmu target other than matrix.system_target above,
        # TCG-only (no --enable-kvm): reuses the linux-headers copy the
        # step above already created, in a separate build dir so this
        # doesn't disturb the accelerated build.
        run: |
          set -euo pipefail
          ALL_TARGETS="$(cd configs/targets && ls *-softmmu.mak | sed 's/\.mak$//')"
          OTHER_TARGETS="$(echo "$ALL_TARGETS" | grep -vx '${{ matrix.system_target }}' | paste -sd, -)"
          mapfile -t SYSTEM_BINS < <(
            echo "$OTHER_TARGETS" | tr ',' '\n' |
              sed -e 's/-softmmu$//' -e 's/^/qemu-system-/'
          )
          export QEMU_PKG_VERSION="${{ env.RELEASE_VERSION }}"
          scripts/build-static-linux-with-zig.sh \
            build-zig-other \
            "$OTHER_TARGETS" \
            "${SYSTEM_BINS[@]}"

      - name: Build qemu-img/qemu-io/${{ matrix.system_bin }} with zig cc (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          # bison/flex are keg-only on macOS (Homebrew won't symlink them
          # into PATH since macOS ships its own, incompatible versions).
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"

          BUILD_DIR="$PWD/build-zig"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          ../configure \
            --cc="zig cc" \
            --cxx="zig c++" \
            --with-pkgversion="${{ env.RELEASE_VERSION }}" \
            --target-list="${{ matrix.system_target }}" \
            --without-default-features \
            --enable-tools \
            ${{ matrix.accel_opt }} \
            --bindir= \
            --with-suffix= \
            --disable-werror \
            --disable-plugins \
            --enable-slirp \
            --enable-strip \
            --extra-cflags="-UNDEBUG" \
            --extra-cxxflags="-UNDEBUG"
          ninja qemu-img qemu-io "${{ matrix.system_bin }}"

      - name: Build other (non-accelerated) qemu-system-* targets (macOS)
        if: runner.os == 'macOS'
        # Every softmmu target other than matrix.system_target above,
        # TCG-only (no --enable-hvf), in a separate build dir so this
        # doesn't disturb the accelerated build.
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"

          ALL_TARGETS="$(cd configs/targets && ls *-softmmu.mak | sed 's/\.mak$//')"
          OTHER_TARGETS="$(echo "$ALL_TARGETS" | grep -vx '${{ matrix.system_target }}' | paste -sd, -)"

          BUILD_DIR="$PWD/build-zig-other"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          ../configure \
            --cc="zig cc" \
            --cxx="zig c++" \
            --with-pkgversion="${{ env.RELEASE_VERSION }}" \
            --target-list="$OTHER_TARGETS" \
            --without-default-features \
            --enable-tools \
            --bindir= \
            --with-suffix= \
            --disable-werror \
            --disable-plugins \
            --enable-slirp \
            --enable-strip \
            --extra-cflags="-UNDEBUG" \
            --extra-cxxflags="-UNDEBUG"
          ninja $(echo "$OTHER_TARGETS" | tr ',' '\n' | sed -e 's/-softmmu$//' -e 's/^/qemu-system-/')

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        # --enable-strip (-Dstrip=true) only strips *on install*
        # (per `meson configure`'s own help text: "Strip targets on
        # install"), but this workflow only ever runs plain `ninja
        # <target>`, never `ninja install` -- so it silently did nothing,
        # leaving every binary built with full debug info (confirmed via
        # `file`: "with debug_info, not stripped"), ~3-4x larger than a
        # stripped build. Strip explicitly instead.
        #
        # Deliberately not done on macOS: `strip` invalidates a Mach-O's
        # code signature without reapplying one, and Apple Silicon's
        # kernel refuses to *launch* any binary whose signature doesn't
        # match its current bytes (unrelated to Gatekeeper/notarization).
        # Re-signing afterwards (ad hoc, plus reapplying
        # accel/hvf/entitlements.plist to the HVF-accelerated target)
        # does work -- v11.0.50-z.5 shipped that way -- but was measured
        # to only save ~15% of the already-small (once the *-unsigned
        # copies below are excluded) compressed package size, not worth
        # the ongoing risk of a future QEMU version changing what needs
        # signing/entitlements and this workflow silently shipping
        # broken binaries again (as v11.0.50-z.4 did).
        run: |
          strip build-zig/qemu-img build-zig/qemu-io "build-zig/${{ matrix.system_bin }}"
          find build-zig-other -maxdepth 1 -type f -name 'qemu-system-*' -exec strip {} +

      - name: Verify binaries
        run: |
          ./build-zig/qemu-img --version
          ./build-zig/qemu-io --version
          ./build-zig/${{ matrix.system_bin }} --version
          # -maxdepth 1 -type f: build-zig-other/ also contains meson/ninja
          # build-artifact dirs alongside each binary (e.g.
          # qemu-system-alpha.p/), which the plain qemu-system-* glob used
          # to match too, causing "$bin: Is a directory" here. On macOS,
          # it also contains a "<name>-unsigned" copy of every target
          # (see the Strip binaries (Linux) step above) -- exclude those
          # too, we only want the final signed binary.
          find build-zig-other -maxdepth 1 -type f -name 'qemu-system-*' ! -name '*-unsigned' -print0 |
            while IFS= read -r -d '' bin; do "$bin" --version; done
          if [ "${{ runner.os }}" = Linux ]; then
            find build-zig build-zig-other -maxdepth 1 -type f \
              \( -name 'qemu-img' -o -name 'qemu-io' -o -name 'qemu-system-*' \) \
              -print0 |
              while IFS= read -r -d '' bin; do
                file "$bin"
                PROGRAM_HEADERS="$(readelf -lW "$bin")"
                DYNAMIC_SECTION="$(readelf -dW "$bin" 2>&1)"
                if grep -q ' INTERP ' <<< "$PROGRAM_HEADERS"; then
                  echo "$bin has an ELF interpreter" >&2
                  exit 1
                fi
                if grep -q '(NEEDED)' <<< "$DYNAMIC_SECTION"; then
                  echo "$bin has a dynamic library dependency" >&2
                  exit 1
                fi
              done
            NETDEV_BACKENDS="$(build-zig/${{ matrix.system_bin }} -netdev help 2>&1)"
            printf '%s\n' "$NETDEV_BACKENDS"
            grep -qx 'user' <<< "$NETDEV_BACKENDS"
          fi

      - name: Package
        run: |
          PKGNAME="qemu-${{ env.RELEASE_VERSION }}-${{ matrix.name }}"
          mkdir -p "$PKGNAME/share"
          cp build-zig/qemu-img build-zig/qemu-io "build-zig/${{ matrix.system_bin }}" "$PKGNAME/"
          # See the Verify binaries step above for why this must exclude
          # the qemu-system-*.p/ build-artifact dirs and (macOS only)
          # the qemu-system-*-unsigned copies alongside the actual
          # binaries in build-zig-other/.
          find build-zig-other -maxdepth 1 -type f -name 'qemu-system-*' ! -name '*-unsigned' -exec cp {} "$PKGNAME/" \;
          # See the Windows job's Package step for why pc-bios/'s *contents*
          # (not the pc-bios/ dir itself) go directly into share/, and why
          # it must be a sibling of the binaries above (empty
          # --bindir=/--with-suffix= at configure time, see build step).
          cp -r pc-bios/* "$PKGNAME/share/"
          if [ "${{ runner.os }}" = Linux ]; then
            mkdir -p "$PKGNAME/share/licenses"
            cp -r zig-out-static-deps/share/licenses/qemu-deps \
              "$PKGNAME/share/licenses/"
          fi
          cp COPYING "$PKGNAME/" 2>/dev/null || true
          tar czf "$PKGNAME.tar.gz" "$PKGNAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: qemu-*.tar.gz

  build-windows-cross:
    name: Build (windows-x64, cross-compile)
    runs-on: ubuntu-latest
    # Stretch goal, like this branch's zig-windows-cross.yml /
    # zig-windows-system-cross.yml: not yet promoted to a required check.
    continue-on-error: true
    steps:
      - name: Checkout current QEMU commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: qemu

      - name: Install zig cc via ghr
        uses: cataggar/ghr/actions/install@v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 ninja-build pkg-config python3 python3-pip python3-venv \
            binutils-mingw-w64-x86-64 gcc g++
          pip install --user 'meson>=1.5.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build qemu-img.exe/qemu-io.exe/qemu-system-x86_64.exe with zig cc
        # Everything below is inlined (not scripts/build-with-zig-cc-windows*.sh
        # from the checkout), matching the Linux/macOS build steps above. See
        # scripts/build-with-zig-cc-windows-system.sh on this repo's zig16
        # branch for the (documented, currently-in-sync) non-release version
        # of this same build, and https://github.com/cataggar/qemu/issues/20
        # for the full rationale behind each workaround below.
        run: |
          set -euo pipefail

          ZIG_TARGET=x86_64-windows-gnu
          CROSS_PREFIX=x86_64-w64-mingw32-
          SRC_DIR="$PWD/qemu"
          BUILD_DIR="$PWD/build-zig-windows"
          SYSROOT="$PWD/zig-out-windows-deps"
          mkdir -p "$BUILD_DIR" "$SYSROOT"

          (
            cd "$SRC_DIR"
            zig build deps \
              -Dtarget="$ZIG_TARGET" \
              -Doptimize=ReleaseFast \
              --prefix "$SYSROOT"
          )

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG=pkg-config

          # zig's bundled mingw-w64 subset doesn't include the libpathcch.a/
          # libsynchronization.a friendly-name import-lib aliases meson.build
          # hard-requires on Windows, only the underlying real Microsoft
          # api-ms-win-*.def files. Synthesize the two aliases with `zig
          # dlltool`. (See scripts/zig-cc-windows-defs/*.def on this repo's
          # zig16 branch for the same content, with fuller rationale
          # comments -- inlined here rather than read from the checkout.)
          DEFS_DIR="$BUILD_DIR/defs"
          mkdir -p "$DEFS_DIR"

          cat > "$DEFS_DIR/pathcch.def" <<'EOF'
          LIBRARY api-ms-win-core-path-l1-1-0
          EXPORTS
          PathAllocCanonicalize
          PathAllocCombine
          PathCchAddBackslash
          PathCchAddBackslashEx
          PathCchAddExtension
          PathCchAppend
          PathCchAppendEx
          PathCchCanonicalize
          PathCchCanonicalizeEx
          PathCchCombine
          PathCchCombineEx
          PathCchFindExtension
          PathCchIsRoot
          PathCchRemoveBackslash
          PathCchRemoveBackslashEx
          PathCchRemoveExtension
          PathCchRemoveFileSpec
          PathCchRenameExtension
          PathCchSkipRoot
          PathCchStripPrefix
          PathCchStripToRoot
          PathIsUNCEx
          EOF

          cat > "$DEFS_DIR/synchronization.def" <<'EOF'
          LIBRARY api-ms-win-core-synch-l1-2-0
          EXPORTS
          DeleteSynchronizationBarrier
          EnterSynchronizationBarrier
          InitializeConditionVariable
          InitializeSynchronizationBarrier
          InitOnceBeginInitialize
          InitOnceComplete
          InitOnceExecuteOnce
          InitOnceInitialize
          SignalObjectAndWait
          Sleep
          SleepConditionVariableCS
          SleepConditionVariableSRW
          WaitOnAddress
          WakeAllConditionVariable
          WakeByAddressAll
          WakeByAddressSingle
          WakeConditionVariable
          EOF

          IMPLIB_DIR="$BUILD_DIR/windows-import-libs"
          mkdir -p "$IMPLIB_DIR"
          zig dlltool -d "$DEFS_DIR/pathcch.def" -l "$IMPLIB_DIR/libpathcch.a" -m i386:x86-64
          zig dlltool -d "$DEFS_DIR/synchronization.def" -l "$IMPLIB_DIR/libsynchronization.a" -m i386:x86-64

          # x86_64-w64-mingw32-windres (real GNU tool) shells out to
          # "${cross_prefix}gcc" to preprocess version.rc, which doesn't
          # exist here (only binutils-mingw-w64-x86-64 installed, no
          # gcc-mingw-w64). Use `zig cc -E` instead. `-x c`: zig cc doesn't
          # recognize the .rc extension as C source. `-include
          # winapifamily.h`: version.rc includes <winver.h> directly rather
          # than <windows.h>, which normally pulls in winapifamily.h first.
          cat > "$DEFS_DIR/rc-preprocessor.sh" <<EOF
          #!/bin/sh
          exec zig cc -target $ZIG_TARGET -E -x c -include winapifamily.h "\$@"
          EOF
          chmod +x "$DEFS_DIR/rc-preprocessor.sh"
          export WINDRES="${CROSS_PREFIX}windres --preprocessor=$DEFS_DIR/rc-preprocessor.sh"

          # -DGLIB_STATIC_COMPILATION: without it, glib's headers declare
          # functions with __declspec(dllimport) (glib assumes a shared
          # DLL), and lld-link refuses to resolve those against our plain
          # static glib-2.0.lib. See cataggar/qemu#20 for the full
          # rationale, including why --static isn't used instead.
          EXTRA_FLAGS="-UNDEBUG -DGLIB_STATIC_COMPILATION -I$SYSROOT/include"
          EXTRA_LDFLAGS="-L$IMPLIB_DIR -L$SYSROOT/lib"

          cd "$BUILD_DIR"
          "$SRC_DIR/configure" \
              --cross-prefix="$CROSS_PREFIX" \
              --cc="zig cc -target $ZIG_TARGET" \
              --cxx="zig c++ -target $ZIG_TARGET" \
              --with-pkgversion="${{ env.RELEASE_VERSION }}" \
              --target-list=x86_64-softmmu \
              --enable-tools \
              --enable-whpx \
              --enable-nettle \
              --enable-slirp \
              --enable-zstd \
              --disable-gcrypt \
              --disable-gnutls \
              --disable-sdl \
              --disable-gtk \
              --disable-vnc \
              --disable-opengl \
              --disable-virglrenderer \
              --disable-dbus-display \
              --disable-guest-agent \
              --disable-werror \
              --disable-plugins \
              --disable-curses \
              --disable-brlapi \
              --disable-spice \
              --disable-usb-redir \
              --disable-install-blobs \
              --enable-strip \
              --extra-cflags="$EXTRA_FLAGS" \
              --extra-cxxflags="$EXTRA_FLAGS" \
              --extra-ldflags="$EXTRA_LDFLAGS"

          ninja qemu-img.exe qemu-io.exe qemu-system-x86_64.exe

      - name: Build other (non-accelerated) qemu-system-*.exe targets
        # Every softmmu target other than x86_64-softmmu above,
        # cross-compiled the same way but without --enable-whpx: WHPX
        # only ever accelerates a target matching the host's own
        # architecture (x86_64, already built above), so none of these
        # others have an accelerator to enable. Reuses the dependency
        # builds, generated .pc files, import-lib aliases, and windres
        # wrapper from the step above (all target-list-independent) --
        # only the build dir and configure's --target-list/--enable-whpx
        # differ.
        run: |
          set -euo pipefail

          ZIG_TARGET=x86_64-windows-gnu
          CROSS_PREFIX=x86_64-w64-mingw32-
          SRC_DIR="$PWD/qemu"
          PREV_BUILD_DIR="$PWD/build-zig-windows"
          SYSROOT="$PWD/zig-out-windows-deps"
          BUILD_DIR="$PWD/build-zig-windows-other"
          mkdir -p "$BUILD_DIR"

          export PKG_CONFIG_PATH="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$SYSROOT/lib/pkgconfig"
          export PKG_CONFIG=pkg-config
          export WINDRES="${CROSS_PREFIX}windres --preprocessor=$PREV_BUILD_DIR/defs/rc-preprocessor.sh"

          ALL_TARGETS="$(cd "$SRC_DIR/configs/targets" && ls *-softmmu.mak | sed 's/\.mak$//')"
          # hexagon-softmmu excluded: its target/hexagon/idef-parser is a
          # *build-machine* helper tool that meson compiles and runs during
          # the build itself, not part of the final (Windows) target --
          # but our single PKG_CONFIG_PATH above only describes Windows
          # (cross/host-machine) dependencies, so linking that native
          # helper against them fails ("cannot find -lglib-2.0" et al, the
          # native /usr/bin/ld can't use our Windows-target glib build).
          # Fixing this needs a proper meson --native-file with its own,
          # separate (build-machine) glib -- out of scope here.
          OTHER_TARGETS="$(echo "$ALL_TARGETS" | grep -vx -e x86_64-softmmu -e hexagon-softmmu | paste -sd, -)"

          EXTRA_FLAGS="-UNDEBUG -DGLIB_STATIC_COMPILATION -I$SYSROOT/include"
          EXTRA_LDFLAGS="-L$PREV_BUILD_DIR/windows-import-libs -L$SYSROOT/lib"

          cd "$BUILD_DIR"
          "$SRC_DIR/configure" \
              --cross-prefix="$CROSS_PREFIX" \
              --cc="zig cc -target $ZIG_TARGET" \
              --cxx="zig c++ -target $ZIG_TARGET" \
              --with-pkgversion="${{ env.RELEASE_VERSION }}" \
              --target-list="$OTHER_TARGETS" \
              --enable-tools \
              --enable-nettle \
              --enable-slirp \
              --enable-zstd \
              --disable-gcrypt \
              --disable-gnutls \
              --disable-sdl \
              --disable-gtk \
              --disable-vnc \
              --disable-opengl \
              --disable-virglrenderer \
              --disable-dbus-display \
              --disable-guest-agent \
              --disable-werror \
              --disable-plugins \
              --disable-curses \
              --disable-brlapi \
              --disable-spice \
              --disable-usb-redir \
              --disable-install-blobs \
              --enable-strip \
              --extra-cflags="$EXTRA_FLAGS" \
              --extra-cxxflags="$EXTRA_FLAGS" \
              --extra-ldflags="$EXTRA_LDFLAGS"

          ninja $(echo "$OTHER_TARGETS" | tr ',' '\n' | sed -e 's/-softmmu$//' -e 's/^/qemu-system-/' -e 's/$/.exe/')

      - name: Strip binaries
        # Same issue as the Linux/macOS jobs' Strip binaries step:
        # --enable-strip (-Dstrip=true) only strips *on install*, which
        # this workflow never runs. Strip explicitly with the mingw
        # cross-strip (binutils-mingw-w64-x86-64, installed above).
        run: |
          x86_64-w64-mingw32-strip build-zig-windows/*.exe build-zig-windows-other/*.exe

      - name: Verify binaries
        # Cross-compiled *for* Windows, built *on* Linux -- can't execute
        # these here (no Windows runner, no Wine), so just confirm each is
        # a real PE32+ executable. See cataggar/qemu#20 for how
        # qemu-system-x86_64.exe (the only accelerated one, WHPX) was
        # actually run and boot-tested, manually, on real Windows
        # hardware; every other qemu-system-*.exe below is TCG-only and
        # build-verified only.
        run: |
          EXES=$(ls build-zig-windows/*.exe build-zig-windows-other/*.exe)
          COUNT=$(printf '%s\n' "$EXES" | wc -l)
          file $EXES | tee /dev/stderr | grep -c 'PE32+ executable' | grep -qx "$COUNT"

      - name: Package
        run: |
          PKGNAME="qemu-${{ env.RELEASE_VERSION }}-windows-x64"
          mkdir -p "$PKGNAME/share"
          cp build-zig-windows/qemu-img.exe build-zig-windows/qemu-io.exe build-zig-windows/qemu-system-x86_64.exe "$PKGNAME/"
          cp build-zig-windows-other/qemu-system-*.exe "$PKGNAME/"
          # QEMU's runtime firmware/data lookup (util/datadir.c,
          # util/cutils.c's get_relocated_path()) is relocatable: it
          # resolves relative to the running .exe's own directory. But on
          # Windows, meson.build sets qemu_suffix/bindir both empty
          # (configs/meson/windows.txt), so the compiled-in datadir is
          # just "<prefix>/share" with the .exe directly in "<prefix>"
          # itself (no "bin/" nesting) -- i.e. .exe and share/ must be
          # *siblings*, confirmed empirically (see cataggar/qemu#20).
          # pc-bios/*.bin/*.rom install flat into that datadir (see
          # pc-bios/meson.build's install_data(blobs, install_dir:
          # qemu_datadir)), not nested under a "pc-bios/" subdirectory --
          # so copy its *contents* into share/, not the pc-bios/ dir
          # itself, or qemu-system-x86_64.exe won't find them by default.
          cp -r qemu/pc-bios/* "$PKGNAME/share/"
          # EDK2 firmware is stored compressed in the source tree and
          # normally unpacked by Meson during installation. This release
          # packages files directly instead, so unpack it explicitly.
          # QEMU can then resolve `-bios
          # edk2-x86_64-code.fd` from its sibling share directory.
          for firmware in qemu/pc-bios/*.fd.bz2; do
            bzip2 -dc "$firmware" > "$PKGNAME/share/$(basename "$firmware" .bz2)"
          done
          rm "$PKGNAME/share/"*.fd.bz2
          mkdir -p "$PKGNAME/share/licenses"
          cp -r zig-out-windows-deps/share/licenses/qemu-deps \
            "$PKGNAME/share/licenses/"
          cp qemu/COPYING "$PKGNAME/" 2>/dev/null || true
          zip -r "$PKGNAME.zip" "$PKGNAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: qemu-*.zip

  release:
    name: Create Release
    needs: [build, build-windows-cross]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: qemu-*

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ needs.build.outputs.qemu_sha }}
          name: qemu ${{ env.RELEASE_VERSION }}
          body: |
            Install with [ghr](https://cataggar.github.io/ghr/):

            ```
            ghr install cataggar/qemu@${{ env.RELEASE_VERSION }}
            ```
          files: qemu-*
          draft: false
          prerelease: false
