# Configuration for Repo Lockdown - https://github.com/dessant/repo-lockdown

name: 'Repo Lockdown'

on:
  pull_request_target:
    types: opened

permissions:
  pull-requests: write

jobs:
  action:
    runs-on: ubuntu-latest
    # Skip for the repo owner/collaborators: this fork actively develops
    # the zig cc work via real PRs (e.g. #22, #23), unlike a pure read-only
    # mirror. author_association is OWNER for the repo owner and
    # COLLABORATOR/MEMBER for anyone else granted push access; everyone
    # else (random drive-by contributors, the intended audience for the
    # boilerplate below) still gets auto-closed/locked as before.
    if: >-
      !contains(
        fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'),
        github.event.pull_request.author_association
      )
    steps:
      - uses: dessant/repo-lockdown@17c2cc64a91eff426f242b05dd523c6f098889b6 # v5.0.2
        with:
          pr-comment: |
            Thank you for your interest in the QEMU project.

            This repository is a read-only mirror of the project's repostories hosted
            on https://gitlab.com/qemu-project/qemu.git.
            The project does not process merge requests filed on GitHub.

            QEMU welcomes contributions of code (either fixing bugs or adding new
            functionality). However, we get a lot of patches, and so we have some
            guidelines about contributing on the project website:
            https://www.qemu.org/contribute/
          lock-pr: true
          close-pr: true
