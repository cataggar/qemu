name: zig-nbd

on:
  push:
    branches: [zig16]
    paths:
      - 'zig/nbd/**'
      - '.github/workflows/zig-nbd.yml'
  # No `paths:` filter here (unlike push, above): this workflow's `test`
  # job is a required status check, and a required check whose *workflow*
  # never runs (due to a top-level paths filter) leaves that check stuck
  # "Expected" forever, permanently blocking merges for PRs that don't
  # touch zig/nbd. Instead, the workflow always runs and the `changes` job
  # below decides -- via job-level `if:` -- whether `test` actually does
  # anything or reports back as a (non-blocking) "skipped" success.
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'zig/nbd/**'
              - '.github/workflows/zig-nbd.yml'

  test:
    name: Build & test (nbd)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zig/nbd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.6.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Unit tests
        run: zig build test

      - name: Build CLI
        run: zig build

  integration:
    # Stretch goal: cross-validate the client and reference server against a
    # real qemu-nbd/qemu-img/qemu-io build (via `zig cc`). Not yet promoted
    # to a required check, so it doesn't block merges while the Ubuntu
    # build-dependency list is proven out across real runs.
    name: Cross-validate against qemu-nbd/qemu-img/qemu-io
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.6.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config python3 python3-pip python3-venv \
            libglib2.0-dev libpixman-1-dev zlib1g-dev

      - name: Build qemu-nbd / qemu-img / qemu-io with zig cc
        run: scripts/build-with-zig-cc.sh build-zig --target-list=x86_64-softmmu
        # Builds every default target for x86_64-softmmu (not just
        # qemu-nbd/qemu-img/qemu-io); slower than strictly necessary but
        # keeps this job a thin, low-maintenance wrapper around the existing
        # build script.

      - name: Build nbd CLI
        working-directory: zig/nbd
        run: zig build

      - name: Cross-validate against qemu-nbd/qemu-img/qemu-io
        run: zig/nbd/scripts/cross-validate.sh build-zig zig/nbd/zig-out/bin/nbd
